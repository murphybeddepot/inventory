<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stacker Guide</title>
<!-- v3.22 (2026-08-11) — footer back on the iPad screen: 100dvh (visible
     viewport) instead of 100vh, safe-area padding on the footer, resize
     re-render for toolbar collapse. -->
<!-- v3.21 (2026-08-11) — PIN provisioning. An unprovisioned device now gets a
     PIN box instead of a dead "recipe not found": enter the shop PIN, the page
     exchanges it for the device secret (throttled RPC) and reloads. -->
<!-- v3.20 (2026-08-11) — parts drawn in the right frame. Recipe centres are in
     the FOOTPRINT frame (editor clamps 0..foot); the guide drew them raw in the
     pallet viewBox, hanging parts off the dashed line by (19, 50.5)mm. Now
     offset by the footprint origin. -->
<!-- v3.19 (2026-08-11) — white pallet. The pallet outline was dark-on-dark and
     vanished behind the parts (Zac: "the pallet is invisible in the background").
     Now a white deck with slat boards and a solid warm-grey frame; footprint
     dashes regreyed to survive on white. -->
<!-- v3.6 (2026-07-29) — Phase 1 scaffold of Zac's ask (Slack 21:19 EDT):
     full-screen stacking guide for the shop iPad + TV. Loads a recipe by
     ?sku=X from cloud (Supabase RPC) or localStorage, renders one layer
     at a time with giant tap-targets. Tap toggles "in place" (local
     state only in Phase 1); "Layer complete → Next" advances. Phase 2
     will persist tap-marks server-side + wire the "assign recipe to
     production order" from the Bedrock Orders tab. -->
<script src="./config.js"></script>
<style>
  :root{
    --bg:#101317; --panel:#1a1e24; --panel2:#242932;
    --ink:#f5f4f0; --ink2:#c8c5bd; --ink3:#8a867c;
    --line:#333842; --line2:#454b57;
    --accent:#4d9fff; --accent-strong:#1f5fff;
    --good:#2fd67d; --good-strong:#1fb063; --good-soft:#173a26;
    --warn:#f5a623;
    --bad:#e04d4d;
    --pallet:#c9c4b8; --pallet-fill:#f5f4f0; --pallet-slat:#e7e3da; /* v3.19: white pallet — was dark-on-dark, invisible behind the parts (Zac) */
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  /* v3.22: 100vh on iPad Safari includes the space behind the toolbar, which
     pushed the footer buttons off-screen with no scroll (overflow:hidden).
     dvh tracks the VISIBLE viewport; vh stays as the fallback for old engines. */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* Top bar — SKU + layer position + progress */
  header{flex:0 0 auto;display:flex;align-items:center;gap:16px;
    padding:14px 24px;background:var(--panel);border-bottom:2px solid var(--line2)}
  header .brand{font-size:18px;font-weight:700;letter-spacing:.5px;
    color:var(--ink2);text-transform:uppercase}
  header .sku{font-size:28px;font-weight:700;font-family:var(--mono);
    color:var(--ink);letter-spacing:1px}
  header .spacer{flex:1}
  header .badge{font-size:16px;font-weight:600;padding:8px 16px;
    background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
    color:var(--ink2)}
  header .badge.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
  header a.back{color:var(--ink3);text-decoration:none;font-size:20px;padding:6px 10px}
  header a.back:hover{color:var(--ink)}

  /* Progress bar under header */
  .progressbar{height:6px;background:var(--panel2);flex:0 0 auto;position:relative}
  .progressbar .fill{position:absolute;top:0;left:0;bottom:0;background:var(--good);
    transition:width .3s ease}

  /* Main render surface */
  main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;
    padding:24px;min-height:0}
  .stage svg{max-width:100%;max-height:100%;background:transparent}

  /* Empty / error states */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:40px;color:var(--ink2);font-size:22px}
  .empty .big{font-size:32px;font-weight:700;color:var(--ink)}
  .empty .hint{font-size:16px;color:var(--ink3);max-width:520px;line-height:1.5}
  .empty a{color:var(--accent)}

  /* Bottom controls */
  footer{flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:16px 24px;background:var(--panel);border-top:2px solid var(--line2)}
    padding-bottom:max(14px, env(safe-area-inset-bottom));
  footer .stat{display:flex;flex-direction:column;gap:2px}
  footer .stat .num{font-size:34px;font-weight:800;line-height:1;
    font-family:var(--mono);color:var(--ink)}
  footer .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3)}
  footer .spacer{flex:1}
  footer button{font-size:20px;font-weight:700;padding:16px 24px;border-radius:12px;
    border:2px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;
    letter-spacing:.5px;transition:all .1s;min-height:56px;min-width:140px;
    font-family:inherit}
  footer button:hover{border-color:var(--accent);color:var(--accent)}
  footer button.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
  footer button.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  footer button.success{background:var(--good-strong);border-color:var(--good-strong);color:#fff}
  footer button.success:hover{background:var(--good);border-color:var(--good);color:#fff}
  footer button:disabled{opacity:.3;cursor:not-allowed}

  /* Placed part rendering — big and tappable */
  .part-shape{stroke:var(--line2);stroke-width:2;cursor:pointer;
    fill:var(--panel2);transition:fill .12s,stroke .12s}
  .part-shape.inplace{fill:var(--good-soft);stroke:var(--good)}
  .part-shape:hover{stroke-width:3}
  .part-label{fill:var(--ink);font-family:var(--mono);font-weight:700;
    text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .part-check{fill:var(--good);font-size:36px;font-weight:800;text-anchor:middle;
    dominant-baseline:middle;pointer-events:none;opacity:0;transition:opacity .12s}
  .part-shape.inplace + .part-check{opacity:1}

  .pallet-outline{fill:var(--pallet-fill);stroke:var(--pallet);stroke-width:3}
  .pallet-slat{fill:var(--pallet-slat)}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(30px);
    background:var(--panel2);color:var(--ink);padding:14px 22px;border-radius:10px;
    border:1px solid var(--line2);font-size:16px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="./" class="back" title="Back to Stacking Recipe Editor">‹</a>
    <span class="brand">Stacker Guide</span>
    <span class="sku" id="skuLabel">—</span>
    <span class="spacer"></span>
    <span class="badge" id="layerBadge">Layer — / —</span>
    <span class="badge" id="progressBadge">0 / 0 in place</span>
  </header>
  <div class="progressbar"><div class="fill" id="progressFill" style="width:0%"></div></div>
  <main>
    <div class="stage" id="stage">
      <div class="empty" id="emptyState">
        <div class="big">No recipe loaded</div>
        <div class="hint">Add <code>?sku=YOUR-SKU</code> to the URL to load a recipe.<br><br>
          Example: <code>guide.html?sku=QBZ-WHITE</code></div>
        <div class="hint">Or return to the <a href="./">Recipe Editor</a>.</div>
      </div>
    </div>
  </main>
  <footer>
    <div class="stat"><span class="num" id="layerNum">—</span><span class="lbl">Layer</span></div>
    <div class="stat"><span class="num" id="layerParts">—</span><span class="lbl">Parts</span></div>
    <div class="stat"><span class="num" id="layerHeight">—</span><span class="lbl">Height (mm)</span></div>
    <span class="spacer"></span>
    <button id="btnReset" title="Clear all in-place marks for this recipe">Reset</button>
    <button id="btnPrev" disabled>← Prev Layer</button>
    <button id="btnComplete" class="success" disabled>Layer Complete →</button>
    <button id="btnNext" class="primary" disabled>Next Layer →</button>
  </footer>
</div>
<div id="toast"></div>

<script>
const SVGNS='http://www.w3.org/2000/svg';
// v3.18 palette — removed the two green-ish entries (sage #7d9a6f and
// teal #6cb0a8) that read as "already marked in-place" before the
// packer taps them. Replaced with dusty violet + dusty magenta so
// green only ever means "the packer said this is done".
const SECTION_COLORS=[
  '#6c8ebf','#b08968','#7d6f9a','#bf6c8e','#8e6cbf',
  '#a86cb0','#c0954a','#a36c6c','#5f8aa6','#9a8e6f','#7a7f8c'
];
const $=id=>document.getElementById(id);
const svgel=(tag,attrs)=>{const e=document.createElementNS(SVGNS,tag);
  if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- STATE ---------- */
const S={
  sku:null,
  orderNumber:null,       // v3.13: when opened via ?order=N, progress keys by order
  snapshot:null,          // the loaded recipe snapshot
  activeLayerIdx:0,
  inPlace:new Set(),      // "layerIdx:partIdx" keys of parts marked in-place
};

/* Persist tap marks + active layer to localStorage. v3.13: prefer
   order-scoped key when opened from an order context so two orders
   sharing a recipe don't collide. Falls back to SKU-scoped for the
   standalone `?sku=X` case. */
const PROGRESS_KEY = () => S.orderNumber
  ? ('mbd_stacking_guide_order:' + S.orderNumber)
  : ('mbd_stacking_guide:' + S.sku);
function saveProgress(){
  if(!S.sku && !S.orderNumber) return;
  try{
    localStorage.setItem(PROGRESS_KEY(), JSON.stringify({
      layer: S.activeLayerIdx,
      inPlace: [...S.inPlace],
      savedAt: new Date().toISOString(),
      order: S.orderNumber || null,
      sku: S.sku || null,
    }));
  }catch(_){}
}
function restoreProgress(){
  if(!S.sku && !S.orderNumber) return false;
  try{
    const raw = localStorage.getItem(PROGRESS_KEY());
    if(!raw) return false;
    const j = JSON.parse(raw);
    S.activeLayerIdx = Number(j.layer)||0;
    S.inPlace = new Set(Array.isArray(j.inPlace) ? j.inPlace : []);
    return true;
  }catch(_){ return false; }
}
function clearProgress(){
  if(!S.sku && !S.orderNumber) return;
  try{ localStorage.removeItem(PROGRESS_KEY()); }catch(_){}
}

/* ---------- STORAGE ---------- */
// v3.9b HOTFIX: the SRE uses `_v1` suffix (see index.html:577). Without
// matching this, the guide never finds recipes saved in the editor.
const LS_LIB='mbd_stacking_library_v1';
const DEV_KEY='mbd_stacking_device';
function loadLib(){try{return JSON.parse(localStorage.getItem(LS_LIB)||'{}');}catch(_){return {};}}
function getDeviceSecret(){try{return localStorage.getItem(DEV_KEY)||'';}catch(_){return '';}}
function hasBackend(){return !!(window.STACKING_CONFIG && window.STACKING_CONFIG.supabase_url && window.STACKING_CONFIG.anon_key);}
function isProvisioned(){return hasBackend() && !!getDeviceSecret();}
// v3.21 — PIN provisioning: exchange the shop PIN for the device secret
// (provision_stacking_device RPC, throttled server-side). Same localStorage
// slot the #setup?device= link fills; just a friendlier door.
async function provisionWithPin(pin){
  const secret=await _rpc('provision_stacking_device',{p_pin:String(pin||'').trim()});
  if(!secret) throw new Error('Empty secret from server');
  localStorage.setItem(DEV_KEY, secret);
  return true;
}
function pinFormHtml(msg){
  return '<div class="big">'+(msg||'Set up this device')+'</div>'+
    '<div class="hint">Enter the shop PIN to load the recipe library on this device. One time only.</div>'+
    '<div style="display:flex;gap:12px;margin-top:18px;align-items:center">'+
    '<input id="pinInput" type="tel" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN" '+
    'style="font-size:34px;font-family:var(--mono);width:190px;text-align:center;letter-spacing:8px;'+
    'padding:12px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);color:var(--ink)">'+
    '<button id="pinGo" style="font-size:20px;font-weight:700;padding:18px 26px;border-radius:12px;'+
    'border:0;background:var(--accent-strong);color:#fff">Unlock</button></div>'+
    '<div class="hint" id="pinErr" style="color:var(--bad);min-height:22px;margin-top:10px"></div>';
}
function wirePinForm(){
  const go=$('pinGo'), inp=$('pinInput');
  if(!go||!inp) return;
  const submit=async()=>{
    go.disabled=true; $('pinErr').textContent='';
    try{
      await provisionWithPin(inp.value);
      toast('\u2713 Device set up for Bedrock sync');
      setTimeout(()=>location.reload(), 600);
    }catch(e){
      $('pinErr').textContent=String(e && e.message || e).replace(/^stacking:\s*/,'');
      go.disabled=false; inp.focus(); inp.select();
    }
  };
  go.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  inp.focus();
}

async function _rpc(fn, args){
  if(!hasBackend()) throw new Error('Bedrock backend not configured.');
  const cfg=window.STACKING_CONFIG;
  const resp=await fetch(cfg.supabase_url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'apikey':cfg.anon_key,'Authorization':'Bearer '+cfg.anon_key,'Content-Type':'application/json'},
    body:JSON.stringify(args),
  });
  const text=await resp.text();
  let json=null; try{json=JSON.parse(text);}catch(_){json=text;}
  if(!resp.ok) throw new Error((json && json.message) ? json.message : ('HTTP '+resp.status));
  return json;
}
async function remoteLoadRecipe(sku){
  const s=getDeviceSecret();
  if(!s) return null;
  const rows=await _rpc('load_stacking_recipe',{p_device_secret:s, p_sku:sku});
  return (rows && rows[0]) ? rows[0] : null;
}
async function remoteListLib(){
  const s=getDeviceSecret();
  if(!s) return null;
  return await _rpc('list_stacking_recipes',{p_device_secret:s});
}
// v3.13 — order↔recipe assignment. Column + RPCs live in orders_spine.
async function remoteGetOrderRecipe(orderNumber){
  const s=getDeviceSecret();
  if(!s) throw new Error('Device not provisioned — cloud lookup unavailable.');
  const rows=await _rpc('get_order_recipe',{p_device_secret:s, p_order_number:String(orderNumber)});
  return (rows && rows[0]) ? rows[0] : null;
}
async function remoteSetOrderRecipe(orderNumber, sku){
  const s=getDeviceSecret();
  if(!s) throw new Error('Device not provisioned — assignment requires cloud sync.');
  const rows=await _rpc('set_order_recipe',{p_device_secret:s, p_order_number:String(orderNumber), p_sku:String(sku||'')});
  return (rows && rows[0]) ? rows[0] : null;
}

/* ---------- LOAD ---------- */
async function loadRecipe(sku){
  S.sku=sku;
  $('skuLabel').textContent=sku;
  // Try cloud first if provisioned; else fall back to localStorage.
  let snap=null; let source='';
  if(isProvisioned()){
    try{
      const remoteFull=await remoteLoadRecipe(sku);
      if(remoteFull && remoteFull.snapshot){snap=remoteFull.snapshot; source='cloud rev '+remoteFull.revision;}
    }catch(err){ /* silent — fall back */ }
  }
  if(!snap){
    const lib=loadLib();
    if(lib[sku]){snap=lib[sku]; source='local';}
  }
  if(!snap){
    if(hasBackend() && !isProvisioned()){
      // v3.21: the recipe may well exist in the cloud — this device just
      // can't see it yet. Offer the PIN right here instead of a dead end.
      $('emptyState').innerHTML=pinFormHtml('Set up this device to load '+sku);
      wirePinForm();
      return;
    }
    $('emptyState').innerHTML='<div class="big">Recipe not found: '+sku+'</div>'+
      '<div class="hint">No recipe with SKU <code>'+sku+'</code> in cloud or local library.<br>'+
      'Open the <a href="./">Recipe Editor</a> to build one first.</div>';
    return;
  }
  S.snapshot=snap;
  S.activeLayerIdx=0;
  S.inPlace.clear();
  $('emptyState')?.remove();
  const resumed=restoreProgress();
  toast('Loaded '+sku+' — '+source + (resumed?' (resumed '+S.inPlace.size+' in-place)':''));
  renderAll();
}

/* ---------- RENDER ---------- */
function renderAll(){
  const snap=S.snapshot;
  if(!snap){return;}
  const layers=snap.layers||[];
  const totalLayers=Math.max(1, layers.length);
  const li=S.activeLayerIdx;
  const layer=layers[li]||[];
  const inPlaceThisLayer=[...S.inPlace].filter(k=>k.startsWith(li+':')).length;
  const total=layer.length;

  $('layerBadge').textContent='Layer '+(li+1)+' / '+totalLayers;
  $('progressBadge').textContent=inPlaceThisLayer+' / '+total+' in place';
  $('layerNum').textContent=(li+1);
  $('layerParts').textContent=total;
  const layerHeight=layer.reduce((mx,p)=>Math.max(mx,p.thickness||19),0);
  $('layerHeight').textContent=Math.round(layerHeight);

  const globalPlaced=S.inPlace.size;
  const globalTotal=layers.reduce((s,l)=>s+l.length,0)||1;
  $('progressFill').style.width=(globalPlaced*100/globalTotal)+'%';

  $('btnPrev').disabled = li<=0;
  $('btnNext').disabled = li>=totalLayers-1;
  $('btnComplete').disabled = !(inPlaceThisLayer===total && total>0);

  renderStage(layer);
}

// v3.22: Safari's toolbar collapsing/expanding resizes the dvh viewport after
// first paint; re-render so the SVG rescales instead of leaving a stale fit.
let _rsz=null;
window.addEventListener('resize', ()=>{ clearTimeout(_rsz); _rsz=setTimeout(()=>{ if(S.snapshot) renderAll(); }, 150); });

function renderStage(layer){
  const stage=$('stage');
  stage.innerHTML='';
  const snap=S.snapshot;
  const foot=snap.foot||{L:1994,W:991};
  const pal=snap.pal||{L:2032,W:1092};

  // Bounding box = pallet outer. Scale to fit stage.
  const stageW=stage.clientWidth-48, stageH=stage.clientHeight-48;
  const pxPerMm=Math.min(stageW/pal.L, stageH/pal.W)*0.92;
  const svgW=pal.L*pxPerMm, svgH=pal.W*pxPerMm;
  const svg=svgel('svg',{width:svgW,height:svgH,viewBox:'0 0 '+pal.L+' '+pal.W});

  // Pallet outline — v3.19: white with deck boards, so the pallet reads as a
  // pallet instead of vanishing into the page (Zac 2026-08-11).
  svg.appendChild(svgel('rect',{x:0,y:0,width:pal.L,height:pal.W,class:'pallet-outline',rx:6}));
  // Deck boards run across the width; ~140mm boards with ~60mm gaps.
  (function(){
    const BOARD=140, GAP=60, PITCH=BOARD+GAP;
    const n=Math.floor((pal.L-GAP)/PITCH);
    const off=(pal.L-(n*PITCH-GAP))/2;
    for(let i=0;i<n;i++)
      svg.appendChild(svgel('rect',{x:off+i*PITCH,y:8,width:BOARD,height:pal.W-16,
        class:'pallet-slat',rx:4}));
  })();

  // Footprint (subtle inner outline where parts go) — grey that survives on white
  const footOffX=(pal.L-foot.L)/2, footOffY=(pal.W-foot.W)/2;
  svg.appendChild(svgel('rect',{x:footOffX,y:footOffY,width:foot.L,height:foot.W,
    fill:'none',stroke:'#9a958a','stroke-width':2,'stroke-dasharray':'8 6'}));

  // v3.11: uniform label font sized to the SVG viewBox (not per-part) so
  // every part reads at the same weight. Zac's ask: bolder blocks + same
  // font size + always the short 2A-style code.
  const LABEL_SIZE = Math.round(Math.min(pal.L, pal.W) * 0.055); // ~55px @ 991mm short side

  // Placed parts.
  // v3.20: p.cx/p.cy are the part centre in the FOOTPRINT frame — the editor
  // clamps placements to 0..foot.L/0..foot.W (inFootprint, index.html) — so
  // every part must shift by the footprint offset inside the pallet viewBox.
  // Drawing them raw is why parts hung off the dashed line left and bottom
  // by exactly (19, 50.5)mm while the recipe showed them inside (Zac's
  // screenshot, 2026-08-11).
  const li=S.activeLayerIdx;
  layer.forEach((p,pi)=>{
    const key=li+':'+pi;
    const inplace=S.inPlace.has(key);
    const pcx = p.cx + footOffX, pcy = p.cy + footOffY;
    const w = p.angle===90||p.angle===270 ? p.W : p.L;
    const h = p.angle===90||p.angle===270 ? p.L : p.W;
    const x = pcx - w/2, y = pcy - h/2;
    const rect=svgel('rect',{x,y,width:w,height:h,rx:4,
      class:'part-shape'+(inplace?' inplace':''),
      'data-key':key});
    // Solid fills + DARK stroke so adjacent parts show a visible gap.
    // Zac 2026-07-30 feedback: v3.11 was bolder but parts blurred together.
    // Stroke color = page bg (#101317). Where two parts share an edge,
    // their two strokes stack into a dark ~6px line.
    const secColor = SECTION_COLORS[p.secIdx%SECTION_COLORS.length];
    rect.style.fill = inplace ? '#1fb063' : secColor;
    rect.style.stroke = inplace ? '#0e1116' : '#0e1116';
    rect.style.strokeWidth = 4;
    rect.addEventListener('click', ()=>togglePart(key));
    svg.appendChild(rect);
    // Uniform-size label — short 2A-style code preferred. If a part has
    // no partNum (should be rare — usually text-imported recipes), fall
    // back to the first token of the name UPPERCASED so it still looks
    // like a code rather than a sentence.
    const short = (p.partNum && String(p.partNum).trim())
      || (p.name ? String(p.name).split(/\s+/)[0].slice(0,4).toUpperCase() : '?');
    const lbl=svgel('text',{x:pcx,y:pcy,class:'part-label','font-size':LABEL_SIZE});
    lbl.textContent = short;
    svg.appendChild(lbl);
    // Checkmark badge above the label when inplace
    if(inplace){
      const chk=svgel('text',{x:pcx,y:pcy - LABEL_SIZE*0.85,
        'font-size':LABEL_SIZE*1.1,class:'part-check'});
      chk.textContent='✓';
      chk.style.opacity='1';
      svg.appendChild(chk);
    }
  });
  stage.appendChild(svg);
}

function togglePart(key){
  if(S.inPlace.has(key)) S.inPlace.delete(key); else S.inPlace.add(key);
  saveProgress();
  renderAll();
}

/* ---------- NAV ---------- */
$('btnPrev').onclick=()=>{
  if(S.activeLayerIdx>0){S.activeLayerIdx--; saveProgress(); renderAll();}
};
$('btnNext').onclick=()=>{
  const layers=S.snapshot?.layers||[];
  if(S.activeLayerIdx<layers.length-1){S.activeLayerIdx++; saveProgress(); renderAll();}
};
$('btnComplete').onclick=()=>{
  const layers=S.snapshot?.layers||[];
  const li=S.activeLayerIdx;
  toast('Layer '+(li+1)+' complete!');
  if(li<layers.length-1){setTimeout(()=>{S.activeLayerIdx++; saveProgress(); renderAll();}, 800);}
  else{setTimeout(()=>toast('Stack complete!'), 900);}
};
$('btnReset').onclick=()=>{
  if(!S.snapshot) return;
  if(!confirm('Reset all in-place marks for '+S.sku+'? (Layer view returns to Layer 1.)')) return;
  S.inPlace.clear();
  S.activeLayerIdx=0;
  clearProgress();
  toast('Progress reset for '+S.sku);
  renderAll();
};

/* ---------- ORDER-CONTEXT BOOT (v3.13) ---------- */

// When opened with ?order=N, look up the assigned recipe SKU in
// orders_spine, then load that recipe. Progress persists per-order.
// If no recipe is assigned, show a picker so the packer can assign one
// on the spot without leaving the guide.
async function bootWithOrder(orderNumber, explicitSku){
  S.orderNumber = String(orderNumber);
  // Show order in header
  $('skuLabel').textContent = 'Order #' + orderNumber;
  if(!hasBackend()){
    $('emptyState').innerHTML = '<div class="big">Bedrock backend not configured</div>'+
      '<div class="hint">Order-context guide needs Supabase config. Open <a href="./">the Recipe Editor</a> to check setup.</div>';
    return;
  }
  if(!isProvisioned()){
    $('emptyState').innerHTML = '<div class="big">Device not provisioned</div>'+
      '<div class="hint">Order → recipe assignment requires cloud sync. Ask Zac for the setup URL, or open with <code>?sku=X</code> instead.</div>';
    return;
  }
  // If URL also names a SKU (from a link/QR code), trust it and assign
  // right away — one round-trip instead of two.
  if(explicitSku){
    try{
      await remoteSetOrderRecipe(orderNumber, explicitSku);
      toast('Assigned recipe '+explicitSku+' to order '+orderNumber);
    }catch(err){ toast('Assignment failed: '+err.message); }
    S.sku = explicitSku;
    $('skuLabel').textContent = 'Order #'+orderNumber+' · '+explicitSku;
    await loadRecipe(explicitSku);
    return;
  }
  // Otherwise look up whatever's assigned.
  let assignedSku = null;
  try{
    const row = await remoteGetOrderRecipe(orderNumber);
    if(row) assignedSku = row.stacking_recipe_sku;
  }catch(err){
    $('emptyState').innerHTML = '<div class="big">Cloud lookup failed</div>'+
      '<div class="hint">'+String(err.message||err)+'</div>';
    return;
  }
  if(assignedSku){
    S.sku = assignedSku;
    $('skuLabel').textContent = 'Order #'+orderNumber+' · '+assignedSku;
    await loadRecipe(assignedSku);
    return;
  }
  // Unassigned — draw a picker in the empty state.
  await renderOrderRecipePicker(orderNumber);
}

async function renderOrderRecipePicker(orderNumber){
  const empty = $('emptyState');
  if(!empty){ return; }
  empty.innerHTML = '<div class="big">No recipe assigned yet</div>'+
    '<div class="hint">Order <b>#'+orderNumber+'</b> has no stacking recipe. Pick one below — it saves to the order so any device opens the same recipe next time.</div>'+
    '<div id="pickerBox" class="hint">Loading library…</div>';
  let recipes = [];
  try{
    const rows = await remoteListLib();
    if(Array.isArray(rows)) recipes = rows;
  }catch(err){
    $('pickerBox').textContent = 'Failed to load recipe library: ' + err.message;
    return;
  }
  if(!recipes.length){
    $('pickerBox').innerHTML = 'No recipes in the cloud library yet. Build one in the <a href="./">Recipe Editor</a> and Save it first.';
    return;
  }
  recipes.sort((a,b)=>String(a.sku).localeCompare(String(b.sku)));
  const box = $('pickerBox');
  box.innerHTML = '<div style="display:flex;flex-direction:column;gap:8px;max-width:560px;margin:16px auto 0">' +
    recipes.map(r =>
      '<button data-sku="'+encodeURIComponent(r.sku)+'" class="pickBtn" style="'+
      'padding:14px 18px;font-size:16px;font-weight:600;background:var(--panel2);border:1px solid var(--line2);'+
      'border-radius:10px;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit">'+
      '<span style="font-family:var(--mono);color:var(--accent)">'+String(r.sku).replace(/</g,'&lt;')+'</span>'+
      '<span style="color:var(--ink3);float:right;font-size:12px">rev '+r.revision+' · '+
      new Date(r.updated_at).toLocaleDateString()+'</span></button>'
    ).join('') +
    '</div>';
  box.querySelectorAll('.pickBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const sku = decodeURIComponent(btn.getAttribute('data-sku'));
      btn.textContent = 'Assigning ' + sku + '…';
      try{
        await remoteSetOrderRecipe(orderNumber, sku);
        // Rewrite URL so a reload brings the same context back.
        const url = new URL(location.href);
        url.searchParams.set('sku', sku);
        history.replaceState(null, '', url.toString());
        S.sku = sku;
        $('skuLabel').textContent = 'Order #'+orderNumber+' · '+sku;
        await loadRecipe(sku);
      }catch(err){
        toast('Assignment failed: '+err.message);
        btn.textContent = 'Retry ' + sku;
      }
    });
  });
}

/* ---------- BOOT ---------- */
window.addEventListener('resize', ()=>{if(S.snapshot)renderAll();});
(function boot(){
  const qs=new URLSearchParams(location.search);
  const order=qs.get('order');
  const sku=qs.get('sku');
  if(order){ bootWithOrder(order, sku); return; }
  if(sku){ loadRecipe(sku); return; }
})();
</script>
