<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe storage upgrade</title>
<style>body{font:18px/1.6 system-ui;background:#f5f7fb;color:#182333;max-width:700px;margin:60px auto;padding:24px}a{color:#124ca3}h1{font-size:28px}</style>
<h1>Recipe storage upgrade</h1>
<p id="status" role="status">Moving your saved library to larger browser storage… Keep your original recipe tab open.</p>
<p>This page leaves your open recipe, working copy, and nests untouched.</p>
<script type="module">
import { recipeLibrary } from './js/recipe_store.mjs?v=4.39';
try {
  const library=recipeLibrary();await library.init();
  localStorage.setItem('mbd_recipe_upgrade_after',String(Date.now()));
  document.getElementById('status').textContent='Storage upgraded. '+Object.keys(library.read()).length+' recipes preserved. Return to your ORIGINAL recipe tab and click Save recipe again. After it succeeds, refresh that tab to use the updated editor.';
}catch(err){document.getElementById('status').textContent='Upgrade did not finish. Keep the original recipe tab open. Existing data was preserved. '+err.message;}
</script></html>
