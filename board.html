<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedrock — Warehouse Board</title>
<style>
  :root{ --bg:#0a0d0f; --panel:#12181c; --line:rgba(255,255,255,.10); --text:#e8eef0; --dim:#8aa0a8; --green:#00e676; --orange:#FF9100; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; overflow:hidden; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:2px solid var(--line); background:linear-gradient(180deg,#10171b,#0a0d0f); }
  .brand{ font-size:34px; font-weight:800; letter-spacing:1px; }
  .brand .rock{ color:var(--green); text-shadow:0 0 12px rgba(0,230,118,.5); font-family:'Audiowide',sans-serif; }
  .meta{ text-align:right; }
  .meta .clock{ font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  .meta .date{ font-size:16px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; }
  .grid{ display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:14px; padding:14px; height:calc(100vh - 76px); }
  .col{ background:var(--panel); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  .col h2{ font-size:22px; font-weight:800; letter-spacing:2px; text-transform:uppercase; padding:12px 18px; border-bottom:1px solid var(--line); color:var(--dim); display:flex; justify-content:space-between; align-items:center; }
  .col h2 .badge{ font-size:18px; color:var(--text); background:rgba(255,255,255,.08); border-radius:999px; padding:2px 12px; }
  .col .body{ overflow-y:auto; padding:6px 0; flex:1; }
  .row{ display:flex; align-items:baseline; gap:12px; padding:9px 18px; border-bottom:1px solid rgba(255,255,255,.05); }
  .row .on{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:96px; }
  .row .nm{ font-size:20px; color:var(--text); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .cr{ font-size:15px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .row.prio{ background:rgba(255,145,0,.10); }
  .row.prio .on{ color:var(--orange); }
  .row.prio::after{ content:'1ST'; font-size:12px; font-weight:900; color:#0a0d0f; background:var(--orange); border-radius:5px; padding:2px 7px; align-self:center; }
  .row.overdue{ border-left:4px solid #ff5252; padding-left:14px; }
  .row.overdue-bad{ background:rgba(255,82,82,.14); border-left-width:6px; padding-left:12px; }
  .row.overdue-bad .on{ color:#ff8a80; }
  .overdue-badge{ font-size:12px; font-weight:900; color:#fff; background:#ff5252; border-radius:5px; padding:2px 7px; align-self:center; white-space:nowrap; }
  .overdue-badge.bad{ background:#d32f2f; }
  .fs-btn{ background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:14px; cursor:pointer; font-family:inherit; margin-right:10px; }
  .fs-btn:hover{ background:rgba(255,255,255,.14); }
  .countdown{ font-size:11px; color:var(--dim); font-family:monospace; letter-spacing:.5px; }
  .carrier{ padding:11px 18px; border-bottom:1px solid rgba(255,255,255,.05); display:flex; justify-content:space-between; align-items:center; }
  .carrier .cn{ font-size:22px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .carrier .cc{ font-size:30px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; }
  .check{ display:flex; align-items:center; gap:12px; padding:13px 18px; font-size:22px; border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer; user-select:none; transition:background .15s; }
  .check:hover{ background:rgba(255,255,255,.03); }
  .check .box{ width:26px; height:26px; border:2px solid var(--dim); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s,border-color .15s; }
  .check.done .box{ background:var(--green); border-color:var(--green); color:#0a0d0f; font-weight:900; font-size:18px; }
  .check.done .lbl{ color:var(--dim); text-decoration:line-through; }
  .check .attr{ font-size:12px; color:var(--dim); font-style:italic; margin-left:auto; font-family:monospace; }
  .add-item{ display:flex; align-items:center; gap:10px; padding:11px 18px; font-size:16px; color:var(--dim); cursor:pointer; border-top:1px dashed rgba(255,255,255,.10); }
  .add-item:hover{ background:rgba(0,230,118,.06); color:var(--green); }
  .notes-ta{ width:calc(100% - 36px); margin:8px 18px; min-height:90px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:16px; resize:vertical; }
  .notes-ta:focus{ outline:none; border-color:var(--green); background:rgba(0,230,118,.04); }
  .notes-attr{ padding:0 18px 12px; font-size:12px; color:var(--dim); font-family:monospace; }
  .legend{ padding:14px 18px; font-size:15px; color:var(--dim); font-style:italic; }
  .empty{ padding:24px 18px; color:var(--dim); font-style:italic; font-size:18px; }
  .err{ padding:24px; color:#ff8a80; font-size:18px; }
  footer{ position:fixed; bottom:6px; right:14px; font-size:12px; color:var(--dim); font-family:monospace; }
</style>
</head>
<body>
<header>
  <div class="brand">BED<span class="rock">ROCK</span> · <span style="color:var(--dim);font-size:24px;letter-spacing:3px">WAREHOUSE</span></div>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="fs-btn" onclick="toggleFullscreen()" title="Toggle fullscreen (F)">⛶</button>
    <div class="meta">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="countdown" id="cd">refresh in —</div>
    </div>
  </div>
</header>
<div class="grid">
  <div class="col"><h2>📦 To Pack <span class="badge" id="packBadge">0</span></h2><div class="body" id="packBody"><div class="empty">Loading…</div></div></div>
  <div class="col"><h2>🚚 Carriers <span class="badge" id="carrBadge">0</span></h2><div class="body" id="carrBody"></div></div>
  <div class="col"><h2>📋 Today <span class="badge" id="dateBadge"></span></h2><div class="body" id="noteBody"></div></div>
</div>
<footer id="foot">board v3 · —</footer>
<script>
  // v10.1041 board bump
  var STABLE_URL = 'https://script.google.com/macros/s/AKfycbzVbS4Ofd3ScWvzyw5FUtCk5rtYx61GcNFB8GFdsnlB33WnDJssPj8L8LF66w8dGKCt/exec';
  var DEV_URL = 'https://script.google.com/macros/s/AKfycbxRWGc8U4Q9upNJayYDdOh1Wbveamaob8I2tnK_pnVutACZMv86g3f6QV4PN0L2KKH2/exec';
  var ORCH = /[?&]dev=1/.test(location.search) ? DEV_URL : STABLE_URL;
  var SECRET = localStorage.getItem('mbd_ground_secret') || '';
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  var REFRESH_MS = 45000;
  var lastLoadAt = 0;
  function tick(){
    var d=new Date();
    document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    document.getElementById('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'});
    if (lastLoadAt) {
      var sec = Math.max(0, Math.round((lastLoadAt + REFRESH_MS - Date.now())/1000));
      document.getElementById('cd').textContent = 'refresh in '+sec+'s';
    }
  }
  setInterval(tick,1000); tick();

  function toggleFullscreen(){
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen||function(){})(); }
    else { (document.exitFullscreen||function(){})(); }
  }
  // F key (or double-click anywhere) toggles fullscreen — easy on a TV remote / wireless keyboard.
  document.addEventListener('keydown', function(e){ if (e.key==='f' || e.key==='F') toggleFullscreen(); });
  document.addEventListener('dblclick', toggleFullscreen);

  // v10.1041 — FedEx Express pickup countdown for TV board strip.
  // Window is 2-4pm EST (14:00-16:00). Renders:
  //   before 14:00 → "opens in 2h 15m"
  //   14:00–16:00 → "in progress · closes in 45m"
  //   after 16:00 → hidden (empty string)
  function _pickupCountdown_() {
    var estNow;
    try {
      var s = new Date().toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
      estNow = new Date(s);
    } catch (e) { estNow = new Date(); }
    var mins = estNow.getHours() * 60 + estNow.getMinutes();
    var openMin  = 14 * 60;
    var closeMin = 16 * 60;
    if (mins >= closeMin) return '';
    var color, text;
    if (mins < openMin) {
      var toOpen = openMin - mins;
      color = '#7EABE0';
      text = 'PICKUP WINDOW OPENS IN ' + Math.floor(toOpen / 60) + 'H ' + (toOpen % 60) + 'M';
    } else {
      var toClose = closeMin - mins;
      color = '#FF8A80';
      text = 'PICKUP IN PROGRESS · CLOSES IN ' + Math.floor(toClose / 60) + 'H ' + (toClose % 60) + 'M';
    }
    return '<div style="margin-top:5px;font-size:12px;letter-spacing:.5px;color:' + color + ';font-weight:700;font-family:monospace">' + text + '</div>';
  }

  // Compute days past ship_date for an order (negative = future ship; 0 = today; positive = overdue).
  function daysOverdue(shipIso){
    if (!shipIso) return null;
    var ship = new Date(shipIso + 'T12:00:00');
    var today = new Date(); today.setHours(12,0,0,0);
    return Math.round((today - ship) / (1000*60*60*24));
  }

  async function load(){
    if(!SECRET){ document.getElementById('packBody').innerHTML='<div class="err">No saved credentials on this device. Open the Bedrock PWA here first (it stores the access key), then reload this board.</div>'; return; }
    try{
      var resp = await fetch(ORCH, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action:'getWarehouseBoardData', secret:SECRET }) });
      var data = await resp.json();
      var r = data.result || data;
      if(!r || !r.ok){ document.getElementById('packBody').innerHTML='<div class="err">'+esc((r&&r.error)||'failed to load')+'</div>'; return; }
      render(r);
      lastLoadAt = Date.now();
      document.getElementById('foot').textContent = 'board v3 · '+(/dev=1/.test(location.search)?'DEV':'STABLE')+' · '+new Date().toLocaleTimeString();
    }catch(e){ document.getElementById('packBody').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
  }
  function render(r){
    var pack=r.packing||[];
    var overdueCount = 0;
    pack.forEach(function(p){ var d = daysOverdue(p.ship_date); if (d != null && d > 0) overdueCount++; });
    document.getElementById('packBadge').textContent = pack.length
      + (r.priority_count?(' · '+r.priority_count+' 🔥'):'')
      + (overdueCount?(' · '+overdueCount+' ⏰'):'');
    document.getElementById('packBody').innerHTML = pack.length ? pack.map(function(p){
      var od = daysOverdue(p.ship_date);
      var cls = 'row' + (p.priority?' prio':'');
      if (od != null && od > 0) cls += (od >= 7) ? ' overdue overdue-bad' : ' overdue';
      var odBadge = (od != null && od > 0)
        ? '<span class="overdue-badge'+(od >= 7?' bad':'')+'">'+od+'d</span>'
        : '';
      return '<div class="'+cls+'"><span class="on">'+esc(p.order_number)+'</span>'
        + '<span class="nm">'+esc(p.customer_name||p.task||'—')+'</span>'
        + odBadge
        + '<span class="cr">'+esc(p.carrier||'')+'</span></div>';
    }).join('') : '<div class="empty">Nothing in the pack queue.</div>';

    var carr=r.carriers||[];
    document.getElementById('carrBadge').textContent = carr.length;
    // v10.867 — Express pickup strip at top of Carriers column when one's scheduled today
    var expressStrip = '';
    var ep = r.express_pickup;
    if (ep) {
      var pillBg, pillFg, pillText;
      if (ep.live && ep.confirmation && ep.confirmation !== 'API_FAILED') {
        pillBg = 'rgba(0,230,118,.12)'; pillFg = '#00E676';
        pillText = '✓ FEDEX EXPRESS PICKUP · ' + ep.confirmation;
      } else if (ep.api_error || ep.confirmation === 'API_FAILED') {
        pillBg = 'rgba(255,82,82,.14)'; pillFg = '#FF5252';
        pillText = '🚨 FEDEX PICKUP FAILED — CALL FEDEX';
      } else {
        pillBg = 'rgba(255,179,0,.14)'; pillFg = '#FFB300';
        pillText = '⚠ EXPRESS PICKUP NOT YET AUTO-BOOKED';
      }
      expressStrip = '<div style="padding:14px 18px;background:' + pillBg + ';border-bottom:1px solid rgba(255,255,255,.10);text-align:center">'
        + '<div style="font-size:13px;letter-spacing:1.5px;color:' + pillFg + ';font-weight:800;text-transform:uppercase">' + esc(pillText) + '</div>'
        + (ep.label_count > 1 ? '<div style="font-size:11px;color:var(--dim);margin-top:3px">covering ' + ep.label_count + ' labels · ready 2-4pm</div>' : '<div style="font-size:11px;color:var(--dim);margin-top:3px">ready 2-4pm EST</div>')
        // v10.1041 — Pickup countdown. Shows "closes in Xh Ym"
        // before 4pm EST so warehouse knows how much time is left
        // to get labels stuck on boxes. Shows "in progress" 2-4pm.
        // Hides after 4pm.
        + _pickupCountdown_()
      + '</div>';
    }
    document.getElementById('carrBody').innerHTML = expressStrip + (carr.length ? carr.map(function(c){
      return '<div class="carrier"><span class="cn">'+esc(c.carrier)+'</span><span class="cc">'+c.count+'</span></div>';
    }).join('') : (expressStrip ? '' : '<div class="empty">No carriers assigned.</div>'));

    var n=r.notes||{};
    document.getElementById('dateBadge').textContent = n.date||r.date||'';
    _currentNotes = {
      date: n.date || r.date || '',
      checklist: Array.isArray(n.checklist) ? n.checklist.slice() : [],
      free_notes: typeof n.free_notes === 'string' ? n.free_notes : '',
      updated_at: n.updated_at || '',
      updated_by: n.updated_by || '',
    };
    renderNotesPanel(n.legend || '');
  }

  // v10.408 — interactive notes panel. Tap a row → toggle done +
  // persist. Tap "+ add" → prompt for label + persist. Free-notes
  // textarea debounces saves on input.
  var _currentNotes = null;
  var _freeNotesSaveTimer = null;

  function _bedrockDeviceName(){
    try { return String(localStorage.getItem('mbd_device_name') || '').trim() || 'unknown'; }
    catch (e) { return 'unknown'; }
  }

  function renderNotesPanel(legendText){
    if (!_currentNotes) return;
    var checksHtml = (_currentNotes.checklist || []).map(function(c, idx){
      var done = c && c.done === true;
      var attr = (c && c.set_by) ? ('· '+esc(c.set_by)) : '';
      return '<div class="check'+(done?' done':'')+'" onclick="toggleChecklistItem('+idx+')">'
        + '<span class="box">'+(done?'✓':'')+'</span>'
        + '<span class="lbl">'+esc(c.label||'')+'</span>'
        + (attr?'<span class="attr">'+attr+'</span>':'')
        + '</div>';
    }).join('');
    var addRow = '<div class="add-item" onclick="addChecklistItem()">+ add item</div>';
    var freeNotes = '<textarea class="notes-ta" id="freeNotesTa" placeholder="Free notes — anything for the day…" oninput="scheduleFreeNotesSave()">'+esc(_currentNotes.free_notes||'')+'</textarea>';
    var attrLine = (_currentNotes.updated_at)
      ? '<div class="notes-attr">last edit: '+esc(String(_currentNotes.updated_at).slice(0,16).replace('T',' '))+(_currentNotes.updated_by?' · '+esc(_currentNotes.updated_by):'')+'</div>'
      : '';
    var legend = legendText ? '<div class="legend">'+esc(legendText)+'</div>' : '';
    document.getElementById('noteBody').innerHTML = checksHtml + addRow + freeNotes + attrLine + legend;
  }

  function toggleChecklistItem(idx){
    if (!_currentNotes || !_currentNotes.checklist || !_currentNotes.checklist[idx]) return;
    _currentNotes.checklist[idx].done = !_currentNotes.checklist[idx].done;
    renderNotesPanel('Orange = 1st priority (ship date today or past)');
    persistNotes({ checklist: _currentNotes.checklist });
  }

  function addChecklistItem(){
    var label = (window.prompt('New checklist item') || '').trim();
    if (!label) return;
    _currentNotes.checklist = _currentNotes.checklist || [];
    _currentNotes.checklist.push({ key: label.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0,40), label: label, done: false });
    renderNotesPanel('Orange = 1st priority (ship date today or past)');
    persistNotes({ checklist: _currentNotes.checklist });
  }

  function scheduleFreeNotesSave(){
    if (_freeNotesSaveTimer) clearTimeout(_freeNotesSaveTimer);
    _freeNotesSaveTimer = setTimeout(function(){
      var ta = document.getElementById('freeNotesTa');
      if (!ta) return;
      var txt = String(ta.value || '');
      _currentNotes.free_notes = txt;
      persistNotes({ free_notes: txt });
    }, 900);
  }

  async function persistNotes(payload){
    try {
      var body = Object.assign({ action: 'setWarehouseBoardNotes', secret: SECRET, by: _bedrockDeviceName() }, payload || {});
      var resp = await fetch(ORCH, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
      var data = await resp.json();
      var r = data.result || data;
      if (r && r.ok && r.notes) {
        // refresh attribution + ensure server-normalized state wins
        _currentNotes.updated_at = r.notes.updated_at || _currentNotes.updated_at;
        _currentNotes.updated_by = r.notes.updated_by || _currentNotes.updated_by;
        if (Array.isArray(r.notes.checklist)) _currentNotes.checklist = r.notes.checklist;
      }
    } catch (e) { console.log('persistNotes failed: ' + e.message); }
  }

  load();
  setInterval(load, 45000);
</script>
</body>
</html>
